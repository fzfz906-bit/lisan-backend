<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lisan — Real-Time Translator</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at top right,#12366b 0%,#071426 35%,#020711 100%);
  color:white;
  min-height:100vh;
}

.container{
  width:min(1100px,94%);
  margin:auto;
  padding:25px 0 40px;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:42px;
  font-weight:800;
  letter-spacing:-2px;
}

.subtitle{
  color:#9fb2cc;
  margin-top:5px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:15px;
  padding:8px 14px;
  border-radius:30px;
  background:rgba(255,255,255,.07);
  color:#b9c8db;
  font-size:13px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#35d07f;
}

.language-bar{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  gap:12px;
  align-items:center;
  margin-bottom:20px;
}

.language{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.language strong{
  display:block;
  font-size:19px;
}

.language span{
  color:#91a4bd;
  font-size:12px;
}

.swap{
  border:0;
  width:52px;
  height:52px;
  margin:auto;
  border-radius:50%;
  background:#ffffff;
  color:#06101e;
  font-size:22px;
  cursor:pointer;
}

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  padding:20px;
  backdrop-filter:blur(20px);
}

.person-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.person-title h2{
  margin:0;
  font-size:19px;
}

.person-title span{
  color:#8296b0;
  font-size:12px;
}

.mic{
  width:100%;
  min-height:150px;
  border:0;
  border-radius:20px;
  background:linear-gradient(145deg,#0d2c56,#0a1c35);
  color:white;
  cursor:pointer;
  transition:.2s;
}

.mic:active{
  transform:scale(.98);
}

.mic.recording{
  background:linear-gradient(145deg,#7d1731,#3c1020);
}

.mic-icon{
  font-size:45px;
  display:block;
  margin-bottom:8px;
}

.mic-text{
  font-size:17px;
  font-weight:700;
}

.original{
  margin-top:15px;
  padding:15px;
  min-height:65px;
  background:rgba(0,0,0,.18);
  border-radius:15px;
  color:#dce7f5;
  line-height:1.7;
}

.translation{
  margin-top:10px;
  padding:15px;
  min-height:65px;
  background:rgba(45,143,255,.09);
  border:1px solid rgba(45,143,255,.16);
  border-radius:15px;
  color:#fff;
  line-height:1.7;
}

.label{
  font-size:11px;
  color:#7790ad;
  margin-bottom:5px;
}

.speak{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:14px;
  padding:12px;
  background:rgba(255,255,255,.08);
  color:white;
  cursor:pointer;
}

.chat-card{
  margin-top:20px;
}

.chat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.chat-header h2{
  margin:0;
}

.clear{
  border:0;
  background:rgba(255,255,255,.07);
  color:#b8c7da;
  padding:9px 13px;
  border-radius:12px;
  cursor:pointer;
}

.chat{
  min-height:120px;
  max-height:400px;
  overflow:auto;
}

.empty{
  text-align:center;
  color:#71849e;
  padding:35px 10px;
}

.message{
  margin-bottom:14px;
  padding:14px;
  border-radius:17px;
  background:rgba(255,255,255,.06);
}

.message.you{
  border-right:3px solid #4c9cff;
}

.message.other{
  border-right:3px solid #7ce0a7;
}

.message-name{
  font-size:11px;
  color:#8298b3;
  margin-bottom:5px;
}

.message-original{
  color:#fff;
  line-height:1.6;
}

.message-translation{
  color:#9fc7ff;
  margin-top:6px;
  line-height:1.6;
}

.message-actions{
  margin-top:9px;
}

.message-actions button{
  border:0;
  background:rgba(255,255,255,.07);
  color:#dbe8f8;
  padding:7px 10px;
  border-radius:10px;
  cursor:pointer;
}

.error{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:14px;
  background:rgba(255,60,90,.1);
  border:1px solid rgba(255,60,90,.2);
  color:#ff9aaa;
  line-height:1.6;
}

@media(max-width:700px){
  .people{
    grid-template-columns:1fr;
  }

  .language-bar{
    grid-template-columns:1fr 55px 1fr;
  }

  .logo{
    font-size:35px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">Lisan</div>
    <div class="subtitle">Real-Time Human Language Communication</div>

    <div class="status">
      <span class="dot"></span>
      <span id="serverStatus">Connecting...</span>
    </div>
  </div>

  <div class="language-bar">

    <div class="language">
      <strong id="leftLanguage">العربية 🇸🇦</strong>
      <span id="leftCode">Arabic</span>
    </div>

    <button class="swap" onclick="swapLanguages()">⇄</button>

    <div class="language">
      <strong id="rightLanguage">English 🇺🇸</strong>
      <span id="rightCode">English</span>
    </div>

  </div>

  <div class="people">

    <!-- PERSON 1 -->
    <div class="card">

      <div class="person-title">
        <h2>الشخص الأول</h2>
        <span id="person1Lang">العربية</span>
      </div>

      <button
        id="mic1"
        class="mic"
        onclick="listenFor(1)"
      >
        <span class="mic-icon">🎤</span>
        <span class="mic-text">اضغط وتحدث</span>
      </button>

      <div class="original">
        <div class="label">الكلام الأصلي</div>
        <div id="original1">—</div>
      </div>

      <div class="translation">
        <div class="label">الترجمة</div>
        <div id="translation1">—</div>
      </div>

      <button
        id="speak1"
        class="speak"
        onclick="speakText(lastTranslation1, getTargetLanguage(1))"
      >
        🔊 سماع الترجمة
      </button>

    </div>


    <!-- PERSON 2 -->
    <div class="card">

      <div class="person-title">
        <h2>الشخص الثاني</h2>
        <span id="person2Lang">English</span>
      </div>

      <button
        id="mic2"
        class="mic"
        onclick="listenFor(2)"
      >
        <span class="mic-icon">🎤</span>
        <span class="mic-text">Speak</span>
      </button>

      <div class="original">
        <div class="label">Original</div>
        <div id="original2">—</div>
      </div>

      <div class="translation">
        <div class="label">Translation</div>
        <div id="translation2">—</div>
      </div>

      <button
        id="speak2"
        class="speak"
        onclick="speakText(lastTranslation2, getTargetLanguage(2))"
      >
        🔊 Hear translation
      </button>

    </div>

  </div>


  <div id="errorBox" class="error"></div>


  <div class="card chat-card">

    <div class="chat-header">
      <h2>💬 Conversation</h2>

      <button class="clear" onclick="clearChat()">
        Clear
      </button>
    </div>

    <div id="chat" class="chat">

      <div id="emptyChat" class="empty">
        ابدأ الحديث من أي طرف
      </div>

    </div>

  </div>

</div>


<script>

const BACKEND_URL =
  "https://lisan-backend-mjh3.onrender.com";

let arabicFirst = true;

let recognition = null;
let currentPerson = null;
let currentTranscript = "";

let lastTranslation1 = "";
let lastTranslation2 = "";

let isRecording = false;


/* =========================
   SERVER STATUS
========================= */

async function checkServer(){

  const status =
    document.getElementById("serverStatus");

  try{

    const response =
      await fetch(BACKEND_URL, {
        method:"GET"
      });

    if(response.ok){

      status.textContent =
        "Lisan AI Online";

    }else{

      status.textContent =
        "Server Error";

    }

  }catch(error){

    status.textContent =
      "Server Offline";

  }

}

checkServer();


/* =========================
   LANGUAGE
========================= */

function getSourceLanguage(person){

  if(arabicFirst){

    return person === 1
      ? "Arabic"
      : "English";

  }else{

    return person === 1
      ? "English"
      : "Arabic";

  }

}

function getTargetLanguage(person){

  if(arabicFirst){

    return person === 1
      ? "English"
      : "Arabic";

  }else{

    return person === 1
      ? "Arabic"
      : "English";

  }

}


/* =========================
   SWAP
========================= */

function swapLanguages(){

  arabicFirst = !arabicFirst;

  updateLanguageUI();

}


function updateLanguageUI(){

  const leftLanguage =
    document.getElementById("leftLanguage");

  const rightLanguage =
    document.getElementById("rightLanguage");

  const leftCode =
    document.getElementById("leftCode");

  const rightCode =
    document.getElementById("rightCode");

  const person1 =
    document.getElementById("person1Lang");

  const person2 =
    document.getElementById("person2Lang");

  if(arabicFirst){

    leftLanguage.textContent =
      "العربية 🇸🇦";

    leftCode.textContent =
      "Arabic";

    rightLanguage.textContent =
      "English 🇺🇸";

    rightCode.textContent =
      "English";

    person1.textContent =
      "العربية";

    person2.textContent =
      "English";

  }else{

    leftLanguage.textContent =
      "English 🇺🇸";

    leftCode.textContent =
      "English";

    rightLanguage.textContent =
      "العربية 🇸🇦";

    rightCode.textContent =
      "Arabic";

    person1.textContent =
      "English";

    person2.textContent =
      "العربية";

  }

}


/* =========================
   SPEECH RECOGNITION
========================= */

function getRecognitionLanguage(person){

  return getSourceLanguage(person) === "Arabic"
    ? "ar-SA"
    : "en-US";

}


function createRecognition(person){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    showError(
      "المتصفح الحالي لا يدعم التعرف على الكلام. جرّب Safari أو Chrome."
    );

    return null;
  }

  const r =
    new SpeechRecognition();

  r.lang =
    getRecognitionLanguage(person);

  r.continuous = false;

  r.interimResults = true;

  r.maxAlternatives = 1;

  return r;

}


/* =========================
   LISTEN
========================= */

function listenFor(person){

  hideError();

  if(isRecording){

    return;
  }

  recognition =
    createRecognition(person);

  if(!recognition){
    return;
  }

  currentPerson =
    person;

  currentTranscript =
    "";

  isRecording =
    true;

  const mic =
    document.getElementById(
      "mic" + person
    );

  mic.classList.add("recording");

  mic.querySelector(".mic-text").textContent =
    person === 1
      ? "جاري الاستماع..."
      : "Listening...";


  recognition.onstart = () => {

    currentTranscript =
      "";

  };


  recognition.onresult = (event) => {

    let transcript = "";

    for(
      let i = 0;
      i < event.results.length;
      i++
    ){

      transcript +=
        event.results[i][0].transcript;

    }

    transcript =
      transcript.trim();

    if(transcript){

      currentTranscript =
        transcript;

      document.getElementById(
        "original" + person
      ).textContent =
        transcript;

    }

  };


  recognition.onerror = (event) => {

    console.log(
      "Speech recognition error:",
      event.error
    );

    if(
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ){

      showError(
        "الميكروفون غير مسموح. افتح إعدادات المتصفح واسمح باستخدام الميكروفون."
      );

    }else{

      showError(
        "تعذر التعرف على الكلام. حاول مرة أخرى."
      );

    }

  };


  recognition.onend = async () => {

    isRecording =
      false;

    mic.classList.remove(
      "recording"
    );

    mic.querySelector(".mic-text").textContent =
      person === 1
        ? "اضغط وتحدث"
        : "Speak";


    const text =
      currentTranscript.trim();

    if(!text){

      showError(
        "لم يتم التقاط كلام. حاول مرة أخرى."
      );

      return;

    }

    await translateAndSpeak(
      person,
      text
    );

  };


  try{

    recognition.start();

  }catch(error){

    isRecording =
      false;

    mic.classList.remove(
      "recording"
    );

    showError(
      "تعذر تشغيل الميكروفون."
    );

  }

}


/* =========================
   TRANSLATE
========================= */

async function translateAndSpeak(
  person,
  text
){

  const source =
    getSourceLanguage(person);

  const target =
    getTargetLanguage(person);

  const translationElement =
    document.getElementById(
      "translation" + person
    );

  translationElement.textContent =
    "⏳ جاري الترجمة...";


  try{

    const response =
      await fetch(
        BACKEND_URL + "/translate",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            text,
            source,
            target
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Translation failed"
      );

    }


    const translation =
      (data.translation || "").trim();


    if(!translation){

      throw new Error(
        "لم تصل ترجمة من الخادم"
      );

    }


    translationElement.textContent =
      translation;


    if(person === 1){

      lastTranslation1 =
        translation;

    }else{

      lastTranslation2 =
        translation;

    }


    addMessage(
      person,
      text,
      translation
    );


    speakText(
      translation,
      target
    );


  }catch(error){

    console.error(error);

    translationElement.textContent =
      "فشلت الترجمة";

    showError(
      "خطأ الترجمة: " +
      error.message
    );

  }

}


/* =========================
   TEXT TO SPEECH
========================= */

function speakText(
  text,
  language
){

  if(!text){

    return;

  }


  if(!("speechSynthesis" in window)){

    showError(
      "المتصفح لا يدعم تشغيل الصوت."
    );

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    language === "Arabic"
      ? "ar-SA"
      : "en-US";


  utterance.rate =
    0.95;

  utterance.pitch =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================
   CHAT
========================= */

function addMessage(
  person,
  original,
  translation
){

  const chat =
    document.getElementById(
      "chat"
    );

  const empty =
    document.getElementById(
      "emptyChat"
    );

  if(empty){

    empty.remove();

  }


  const source =
    getSourceLanguage(person);

  const target =
    getTargetLanguage(person);


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " +
    (person === 1
      ? "you"
      : "other");


  const name =
    person === 1
      ? "الشخص الأول"
      : "الشخص الثاني";


  message.innerHTML = `

    <div class="message-name">
      ${name} · ${source} → ${target}
    </div>

    <div class="message-original">
      ${escapeHTML(original)}
    </div>

    <div class="message-translation">
      ${escapeHTML(translation)}
    </div>

    <div class="message-actions">

      <button>
        🔊 سماع
      </button>

    </div>
  `;


  message
    .querySelector("button")
    .onclick = () =>
      speakText(
        translation,
        target
      );


  chat.prepend(
    message
  );

}


/* =========================
   CLEAR
========================= */

function clearChat(){

  document.getElementById(
    "chat"
  ).innerHTML = `
    <div id="emptyChat" class="empty">
      ابدأ الحديث من أي طرف
    </div>
  `;

  document.getElementById(
    "original1"
  ).textContent = "—";

  document.getElementById(
    "translation1"
  ).textContent = "—";

  document.getElementById(
    "original2"
  ).textContent = "—";

  document.getElementById(
    "translation2"
  ).textContent = "—";

  lastTranslation1 =
    "";

  lastTranslation2 =
    "";

}


/* =========================
   ERROR
========================= */

function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.textContent =
    "⚠️ " + message;

  box.style.display =
    "block";

}


function hideError(){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "none";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
